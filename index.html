<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윷놀이</title>
<style>
  :root { --bg:#f6ecd9; --ink:#3b2a1a; --flat:#e9c98f; --round:#8a5a2b; --accent:#b3392b;
          --red:#c0392b; --blue:#2563a8; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR","Malgun Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:20px 12px 40px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  p.sub { margin:0 0 12px; opacity:.7; text-align:center; }
  .teams { display:flex; gap:12px; width:100%; margin-bottom:8px; }
  .team { flex:1; padding:8px 10px; border-radius:12px; background:#fff8; border:3px solid transparent; }
  .team.active { border-color:currentColor; background:#fff; }
  .team.red { color:var(--red); } .team.blue { color:var(--blue); }
  .team b { display:block; margin-bottom:4px; }
  .tray { display:flex; flex-wrap:wrap; gap:6px; min-height:30px; align-items:center; }
  .token { width:28px; height:28px; border-radius:50%; border:2px solid #3b2a1a; background:currentColor; padding:0; cursor:default; }
  .token.ready { cursor:pointer; animation:pulse 1s infinite; }
  .token.done { opacity:.35; }
  .count { font-size:.8rem; color:var(--ink); margin-left:4px; }
  #status { font-weight:700; margin:6px 0; min-height:1.5rem; text-align:center; }
  .sticks { display:flex; gap:12px; margin:8px 0; perspective:800px; }
  .stick { width:30px; height:90px; border-radius:15px; border:3px solid #3b2a1a;
    display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700;
    transition:background .3s; box-shadow:0 4px 8px rgba(0,0,0,.25); }
  .stick.flat { background:var(--flat); }
  .stick.round { background:var(--round); color:#f6ecd9; }
  .stick.throw { animation:toss .9s ease-in-out; }
  @keyframes toss {
    0% { transform:translateY(0) rotateX(0); }
    40% { transform:translateY(-60px) rotateX(540deg); }
    100% { transform:translateY(0) rotateX(1080deg); }
  }
  @keyframes pulse { 50% { transform:scale(1.15); } }
  #result { font-size:2.2rem; font-weight:900; min-height:3rem; color:var(--accent); }
  button.main { font:inherit; font-size:1.15rem; font-weight:700; padding:10px 32px; border:0; border-radius:999px;
    background:var(--accent); color:#fff; cursor:pointer; box-shadow:0 4px 0 #7d2419; }
  button.main:active { transform:translateY(3px); box-shadow:0 1px 0 #7d2419; }
  button.main:disabled { opacity:.5; cursor:not-allowed; }
  .pending { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:10px 0; min-height:36px; }
  .chip { font:inherit; font-weight:700; padding:4px 14px; border-radius:999px; border:2px solid var(--ink); background:#fff; cursor:pointer; }
  .chip.sel { background:var(--ink); color:#fff; }
  #boardWrap { width:100%; }
  .game { display:flex; flex-direction:column; align-items:center; gap:16px; width:min(94vw,640px); }
  .panel { display:flex; flex-direction:column; align-items:center; width:100%; }
  @media (min-width: 900px) {
    .game { flex-direction:row; align-items:flex-start; justify-content:center; width:min(96vw,1180px); gap:28px; }
    #boardWrap { order:1; flex:1 1 640px; max-width:680px; }
    .panel { order:2; flex:0 0 400px; width:400px; }
  }
  svg { width:100%; height:auto; display:block; background:#e9c98f; border-radius:16px; border:4px solid #3b2a1a; }
  .piece { cursor:default; }
  .piece.ready { cursor:pointer; }
  .piece.ready circle { animation:pulse 1s infinite; transform-box:fill-box; transform-origin:center; }
  .target { cursor:pointer; }
  .controls { margin-top:12px; display:flex; flex-wrap:wrap; justify-content:center; gap:10px; align-items:center; }
  .controls select, .controls button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid #3b2a1a55; background:#fff; }
  .legend { font-size:.85rem; opacity:.7; margin-top:8px; text-align:center; }
</style>
</head>
<body>
  <h1>🎲 윷놀이</h1>
  <p class="sub">윷을 던지고, 나온 칸 수만큼 말을 움직여 먼저 모두 골인시키세요</p>

  <div class="game"><div class="panel"><div class="teams">
    <div class="team red" id="team0"><b>🔴 빨강팀</b><div class="tray"></div></div>
    <div class="team blue" id="team1"><b>🔵 파랑팀</b><div class="tray"></div></div>
  </div>

  <div id="status"></div>
  <div class="sticks" id="sticks"></div>
  <div id="result">?</div>
  <button class="main" id="throwBtn">윷 던지기</button>
  <div class="pending" id="pending"></div>

  <div class="controls">
    <label>상대
      <select id="mode"><option value="cpu" selected>컴퓨터</option><option value="pvp">친구 (2인)</option></select>
    </label>
    <label>말 개수
      <select id="pieceCount"><option>2</option><option selected>3</option><option>4</option></select>
    </label>
    <button id="newGame">새 게임</button>
  </div>
  </div>
  <div id="boardWrap"><svg id="board" viewBox="0 0 600 600" aria-label="윷판"></svg></div>
  </div>
  <div class="legend">평평한 면 1개=도(1) · 2개=개(2) · 3개=걸(3) · 4개=윷(4, 한 번 더) · 0개=모(5, 한 번 더)<br>상대 말을 잡으면 한 번 더! 같은 편 말이 만나면 함께 움직여요(업기). 모서리에 멈춘 말은 지름길로 갈 수 있어요.</div>

<script>
const NAMES = {1:"도", 2:"개", 3:"걸", 4:"윷", 0:"모"};
const MOVES = {1:1, 2:2, 3:3, 4:4, 0:5};
const TEAM_NAMES = ["빨강", "파랑"];
const TEAM_COLORS = ["#c0392b", "#2563a8"];

/* ---------- 보드 좌표 ---------- */
// 0~19: 바깥 길(0은 출발/골인), 20~28: 안쪽 지름길(22는 중앙)
const L = 70, R = 530, T = 70, B = 530, S = 92, CEN = [300, 300];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const P = {};
P[0] = [R, B];
for (let i = 1; i <= 4; i++) P[i] = [R, B - S * i];
P[5] = [R, T];
for (let i = 6; i <= 9; i++) P[i] = [R - S * (i - 5), T];
P[10] = [L, T];
for (let i = 11; i <= 14; i++) P[i] = [L, T + S * (i - 10)];
P[15] = [L, B];
for (let i = 16; i <= 19; i++) P[i] = [L + S * (i - 15), B];
P[22] = CEN;
P[20] = lerp(P[5], CEN, 1/3);  P[21] = lerp(P[5], CEN, 2/3);
P[23] = lerp(CEN, P[15], 1/3); P[24] = lerp(CEN, P[15], 2/3);
P[25] = lerp(P[10], CEN, 1/3); P[26] = lerp(P[10], CEN, 2/3);
P[27] = lerp(CEN, P[0], 1/3);  P[28] = lerp(CEN, P[0], 2/3);
const BIG = new Set([0, 5, 10, 15, 22]);

/* ---------- 이동 경로 ('F' = 골인) ---------- */
const range = (a, b) => Array.from({length: b - a + 1}, (_, i) => a + i);
const ROUTES = {
  A: [...range(1, 19), "F"],                                   // 바깥 길
  B: [1, 2, 3, 4, 5, 20, 21, 22, 23, 24, 15, 16, 17, 18, 19, "F"],   // 첫 모서리 지름길
  C: [...range(1, 10), 25, 26, 22, 27, 28, "F"],                // 둘째 모서리 지름길
};

/* ---------- 상태 ---------- */
let teams, turn, throwsLeft, pending, selIdx, choosing, winner, animating, mode = "cpu", cpuTimer;
const humanTurn = () => winner === null && !(mode === "cpu" && turn === 1);

function newGame() {
  clearTimeout(cpuTimer);
  mode = document.getElementById("mode").value;
  const n = +document.getElementById("pieceCount").value;
  teams = [0, 1].map(() => Array.from({length: n}, () => ({route: null, node: null, done: false})));
  turn = 0; throwsLeft = 1; pending = []; selIdx = 0; choosing = null; winner = null; animating = false;
  document.getElementById("result").textContent = "?";
  render();
}

function options(piece, steps) {
  const base = piece.route || "A";
  let cands = [base];
  if (base === "A" && piece.node === 5) cands = ["A", "B"];
  if (base === "A" && piece.node === 10) cands = ["A", "C"];
  return cands.map(route => {
    const r = ROUTES[route];
    const i = piece.node === null ? -1 : r.indexOf(piece.node);
    const j = i + steps;
    return {route, node: j >= r.length - 1 ? "F" : r[j]};
  });
}

function groupOf(piece, team) {
  if (piece.node === null) return [piece];
  return teams[team].filter(p => !p.done && p.node === piece.node);
}

function applyMove(lead, opt) {
  const group = groupOf(lead, turn);
  let captured = false;
  group.forEach(p => {
    p.route = opt.route;
    if (opt.node === "F") { p.done = true; p.node = null; } else p.node = opt.node;
  });
  if (opt.node !== "F") {
    teams[1 - turn].forEach(p => {
      if (!p.done && p.node === opt.node) { p.node = null; p.route = null; captured = true; }
    });
  }
  if (captured) throwsLeft++;
  pending.splice(selIdx, 1);
  selIdx = 0; choosing = null;
  if (teams[turn].every(p => p.done)) { winner = turn; pending = []; throwsLeft = 0; }
  else if (pending.length === 0 && throwsLeft === 0) { turn = 1 - turn; throwsLeft = 1; }
  render(captured ? "상대 말을 잡았어요! 한 번 더 던지세요 🎯" : "");
}

function clickPiece(piece) {
  if (!humanTurn() || pending.length === 0) return;
  const opts = options(piece, pending[selIdx]);
  if (opts.length === 1) applyMove(piece, opts[0]);
  else { choosing = {piece, opts}; render(); }
}

/* ---------- 렌더링 ---------- */
function render(note = "") {
  // 팀 패널
  teams.forEach((ts, t) => {
    const el = document.getElementById("team" + t);
    el.classList.toggle("active", winner === null && turn === t);
    el.querySelector("b").textContent = (t ? "🔵 파랑팀" : "🔴 빨강팀") + (mode === "cpu" ? (t ? " (컴퓨터)" : " (나)") : "");
    const tray = el.querySelector(".tray");
    tray.innerHTML = "";
    const canPick = humanTurn() && turn === t && pending.length > 0;
    let homeShown = false;
    ts.forEach((p, i) => {
      if (p.node !== null && !p.done) return;
      const b = document.createElement("button");
      b.className = "token" + (p.done ? " done" : "");
      b.title = p.done ? "골인" : "대기 중";
      if (!p.done && canPick && !homeShown) {
        b.classList.add("ready");
        b.onclick = () => clickPiece(p);
        homeShown = true;
      } else b.disabled = true;
      tray.appendChild(b);
    });
    const cnt = document.createElement("span");
    cnt.className = "count";
    cnt.textContent = `골인 ${ts.filter(p => p.done).length}/${ts.length}`;
    tray.appendChild(cnt);
  });

  // 상태 문구
  let msg;
  if (winner !== null) msg = `🎉 ${TEAM_NAMES[winner]}팀 승리!`;
  else if (!humanTurn()) msg = throwsLeft ? "🤖 컴퓨터가 윷을 던지는 중…" : "🤖 컴퓨터가 말을 고르는 중…";
  else if (choosing) msg = "이동할 곳을 선택하세요 (지름길 또는 바깥 길)";
  else if (pending.length && throwsLeft) msg = `${TEAM_NAMES[turn]}팀: 말을 움직이거나 윷을 한 번 더 던지세요`;
  else if (pending.length) msg = `${TEAM_NAMES[turn]}팀: 말을 선택해 움직이세요`;
  else msg = `${TEAM_NAMES[turn]}팀: 윷을 던지세요`;
  document.getElementById("status").textContent = note || msg;
  document.getElementById("status").style.color = winner !== null ? TEAM_COLORS[winner] : TEAM_COLORS[turn];

  // 버튼 / 대기 결과
  document.getElementById("throwBtn").disabled = animating || !humanTurn() || throwsLeft === 0;
  const pend = document.getElementById("pending");
  pend.innerHTML = "";
  pending.forEach((s, i) => {
    const c = document.createElement("button");
    c.className = "chip" + (i === selIdx ? " sel" : "");
    c.textContent = `${stepName(s)} (${s}칸)`;
    c.disabled = !humanTurn();
    c.onclick = () => { selIdx = i; choosing = null; render(); };
    pend.appendChild(c);
  });

  renderBoard();
  scheduleCpu();
}
const stepName = s => NAMES[s === 5 ? 0 : s];

function renderBoard() {
  const svg = document.getElementById("board");
  let h = "";
  // 선
  h += `<polygon points="${[0,5,10,15].map(n => P[n].join(",")).join(" ")}" fill="none" stroke="#3b2a1a" stroke-width="5" stroke-linejoin="round"/>`;
  h += `<line x1="${P[5][0]}" y1="${P[5][1]}" x2="${P[15][0]}" y2="${P[15][1]}" stroke="#3b2a1a" stroke-width="5"/>`;
  h += `<line x1="${P[10][0]}" y1="${P[10][1]}" x2="${P[0][0]}" y2="${P[0][1]}" stroke="#3b2a1a" stroke-width="5"/>`;
  // 칸
  Object.keys(P).forEach(n => {
    const [x, y] = P[n];
    const big = BIG.has(+n);
    h += `<circle cx="${x}" cy="${y}" r="${big ? 20 : 12}" fill="${big ? "#f6ecd9" : "#fff8ec"}" stroke="#3b2a1a" stroke-width="${big ? 4 : 3}"/>`;
    if (big) h += `<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="#3b2a1a" stroke-width="2"/>`;
  });
  h += `<text x="${P[0][0]}" y="${P[0][1] + 44}" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a1a">출발·골인</text>`;

  // 말
  const ready = humanTurn() && pending.length > 0;
  teams.forEach((ts, t) => {
    const byNode = {};
    ts.forEach(p => { if (!p.done && p.node !== null) (byNode[p.node] = byNode[p.node] || []).push(p); });
    Object.keys(byNode).forEach(n => {
      const [x, y] = P[n];
      const grp = byNode[n];
      const can = ready && turn === t;
      h += `<g class="piece${can ? " ready" : ""}" data-team="${t}" data-node="${n}">
        <circle cx="${x}" cy="${y}" r="17" fill="${TEAM_COLORS[t]}" stroke="#fff" stroke-width="4"/>
        <circle cx="${x}" cy="${y}" r="17" fill="none" stroke="#3b2a1a" stroke-width="2"/>
        ${grp.length > 1 ? `<text x="${x}" y="${y + 6}" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">${grp.length}</text>` : ""}
      </g>`;
    });
  });

  // 이동 대상 표시
  if (choosing) {
    choosing.opts.forEach((o, i) => {
      const [x, y] = o.node === "F" ? P[0] : P[o.node];
      h += `<g class="target" data-opt="${i}">
        <circle cx="${x}" cy="${y}" r="26" fill="#ffd54a88" stroke="#b3392b" stroke-width="4" stroke-dasharray="6 4"/>
        <text x="${x}" y="${y - 32}" text-anchor="middle" font-size="15" font-weight="800" fill="#b3392b">${o.route === "A" ? "바깥 길" : "지름길"}</text>
      </g>`;
    });
  }
  svg.innerHTML = h;
}

/* ---------- 이벤트 ---------- */
document.getElementById("board").addEventListener("click", e => {
  const tgt = e.target.closest(".target");
  if (tgt && choosing && humanTurn()) { applyMove(choosing.piece, choosing.opts[+tgt.dataset.opt]); return; }
  const pc = e.target.closest(".piece");
  if (pc && humanTurn() && pending.length && +pc.dataset.team === turn) {
    const piece = teams[turn].find(p => !p.done && p.node === +pc.dataset.node);
    clickPiece(piece);
    return;
  }
  if (choosing) { choosing = null; render(); }
});

const stickBox = document.getElementById("sticks");
for (let i = 0; i < 4; i++) {
  const s = document.createElement("div");
  s.className = "stick flat";
  s.textContent = "평";
  stickBox.appendChild(s);
}
const sticks = [...stickBox.children];

document.getElementById("throwBtn").addEventListener("click", () => { if (humanTurn()) doThrow(); });

function doThrow() {
  if (animating || throwsLeft === 0 || winner !== null) return;
  animating = true;
  choosing = null;
  document.getElementById("result").textContent = "…";
  render();
  sticks.forEach(s => { s.classList.remove("throw"); void s.offsetWidth; s.classList.add("throw"); });

  const flats = sticks.map(() => Math.random() < 0.5); // true = 평평한 면
  setTimeout(() => {
    sticks.forEach((s, i) => {
      s.className = "stick " + (flats[i] ? "flat" : "round");
      s.textContent = flats[i] ? "평" : "둥";
    });
    const n = flats.filter(Boolean).length;
    const extra = n === 4 || n === 0;
    document.getElementById("result").textContent = `${NAMES[n]}${extra ? "! 🎉" : ""}`;
    throwsLeft--;
    if (extra) throwsLeft++;
    pending.push(MOVES[n]);
    animating = false;
    render(extra ? `${NAMES[n]}! 한 번 더 던지세요` : "");
  }, 900);
}

/* ---------- 컴퓨터 ---------- */
function scheduleCpu() {
  clearTimeout(cpuTimer);
  if (mode !== "cpu" || turn !== 1 || winner !== null || animating) return;
  cpuTimer = setTimeout(cpuStep, 900);
}

function cpuStep() {
  if (mode !== "cpu" || turn !== 1 || winner !== null || animating) return;
  if (throwsLeft > 0) { doThrow(); return; }
  if (pending.length === 0) return;
  let best = null;
  pending.forEach((steps, si) => {
    const seen = new Set();
    teams[1].forEach(p => {
      if (p.done) return;
      const key = p.node === null ? "home" : "n" + p.node;
      if (seen.has(key)) return;
      seen.add(key);
      options(p, steps).forEach(opt => {
        const sc = scoreMove(p, opt);
        if (!best || sc > best.sc) best = {sc, si, p, opt};
      });
    });
  });
  selIdx = best.si;
  applyMove(best.p, best.opt);
}

function scoreMove(lead, opt) {
  let sc = Math.random();
  if (opt.node === "F") return sc + 60;
  if (teams[0].some(p => !p.done && p.node === opt.node)) sc += 100;      // 잡기
  if (teams[1].some(p => p !== lead && !p.done && p.node === opt.node)) sc += 8; // 업기
  if (opt.node >= 20) sc += 6;                                            // 지름길
  sc += ROUTES[opt.route].indexOf(opt.node) * 0.5;                        // 진행도
  return sc;
}

document.getElementById("newGame").addEventListener("click", newGame);
document.getElementById("mode").addEventListener("change", newGame);
newGame();
</script>
</body>
</html>

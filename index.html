<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윷놀이</title>
<style>
  :root { --bg:#f6ecd9; --ink:#3b2a1a; --flat:#e9c98f; --round:#8a5a2b; --accent:#b3392b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR","Malgun Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:24px 16px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  p.sub { margin:0 0 20px; opacity:.7; }
  .board { display:flex; gap:14px; margin:20px 0; perspective:800px; }
  .stick { width:46px; height:170px; border-radius:23px; border:3px solid #3b2a1a;
    display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700;
    transition:background .3s; box-shadow:0 6px 10px rgba(0,0,0,.25); }
  .stick.flat { background:var(--flat); }
  .stick.round { background:var(--round); color:#f6ecd9; }
  .stick.throw { animation:toss .9s ease-in-out; }
  @keyframes toss {
    0% { transform:translateY(0) rotateX(0); }
    40% { transform:translateY(-120px) rotateX(540deg); }
    100% { transform:translateY(0) rotateX(1080deg); }
  }
  #result { font-size:3rem; font-weight:900; min-height:4rem; color:var(--accent); }
  #detail { min-height:1.5rem; margin-bottom:12px; }
  button { font:inherit; font-size:1.2rem; font-weight:700; padding:12px 36px; border:0; border-radius:999px;
    background:var(--accent); color:#fff; cursor:pointer; box-shadow:0 4px 0 #7d2419; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #7d2419; }
  button:disabled { opacity:.6; cursor:wait; }
  .history { margin-top:24px; text-align:center; max-width:480px; }
  .history span { display:inline-block; margin:3px; padding:3px 10px; border-radius:999px; background:#fff8; border:1px solid #3b2a1a33; }
  table { margin-top:16px; border-collapse:collapse; }
  td, th { padding:4px 14px; border-bottom:1px solid #3b2a1a22; }
  .legend { font-size:.85rem; opacity:.7; margin-top:6px; }
</style>
</head>
<body>
  <h1>🎲 윷놀이</h1>
  <p class="sub">윷가락 4개를 던져 평평한 면의 개수로 결과를 정해요</p>

  <div class="board" id="board"></div>
  <div id="result">?</div>
  <div id="detail"></div>
  <button id="throwBtn">윷 던지기</button>
  <div class="legend">평평한 면 1개=도 · 2개=개 · 3개=걸 · 4개=윷 · 0개=모</div>

  <div class="history" id="history"></div>
  <table id="stats"></table>

<script>
const NAMES = {1:"도", 2:"개", 3:"걸", 4:"윷", 0:"모"};
const MOVES = {1:1, 2:2, 3:3, 4:4, 0:5};
const board = document.getElementById("board");
const resultEl = document.getElementById("result");
const detailEl = document.getElementById("detail");
const btn = document.getElementById("throwBtn");
const historyEl = document.getElementById("history");
const statsEl = document.getElementById("stats");
const counts = {도:0, 개:0, 걸:0, 윷:0, 모:0};
const history = [];

for (let i = 0; i < 4; i++) {
  const s = document.createElement("div");
  s.className = "stick flat";
  s.textContent = "평";
  board.appendChild(s);
}
const sticks = [...board.children];

function render() {
  historyEl.innerHTML = history.slice(-20).reverse().map(h => `<span>${h}</span>`).join("");
  statsEl.innerHTML = "<tr>" + Object.keys(counts).map(k => `<th>${k}</th>`).join("") + "</tr><tr>" +
    Object.values(counts).map(v => `<td>${v}</td>`).join("") + "</tr>";
}

btn.addEventListener("click", () => {
  btn.disabled = true;
  resultEl.textContent = "…";
  detailEl.textContent = "";
  sticks.forEach(s => { s.classList.remove("throw"); void s.offsetWidth; s.classList.add("throw"); });

  const flats = sticks.map(() => Math.random() < 0.5); // true = 평평한 면
  setTimeout(() => {
    sticks.forEach((s, i) => {
      s.className = "stick " + (flats[i] ? "flat" : "round");
      s.textContent = flats[i] ? "평" : "둥";
    });
    const n = flats.filter(Boolean).length;
    const name = NAMES[n];
    resultEl.textContent = name + (n === 4 || n === 0 ? "! 🎉" : "");
    detailEl.textContent = `평평한 면 ${n}개 → ${name} (${MOVES[n]}칸 이동${n === 4 || n === 0 ? ", 한 번 더!" : ""})`;
    counts[name]++;
    history.push(name);
    render();
    btn.disabled = false;
  }, 900);
});

render();
</script>
</body>
</html>
